{% include header.html %}

<main class="main-content">
  <div class="content-wrap">

    <!-- Tutorials Collection -->
    <h2>Learning and Tutorials</h2>
    <div class="collection-grid">
      {% for post in site.machine-learning-tutorials %}
        <div class="post">
          <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
          <p>{{ post.excerpt }}</p>
        </div>
      {% endfor %}
    </div>

    <!-- Projects Collection -->
    <h2>Projects</h2>
    <div class="collection-grid">
      {% for post in site.machine-learning-projects %}
        <div class="post">
          <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
          <p>{{ post.excerpt }}</p>
        </div>
      {% endfor %}
    </div>

  </div>
</main>

{% include footer.html %}
