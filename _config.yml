# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. 
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.
#
# ============================= Theme Settings =============================
# Review documentation to determine if you should use `theme` or `remote_theme`
# https://mmistakes.github.io/minimal-mistakes/docs/quick-start-guide/#installing-the-theme
# theme: minima
remote_theme             : "mmistakes/minimal-mistakes@4.26.2" 
minimal_mistakes_skin    : "dirt" # "default", "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# ============================= Site settings =============================
locale                   : "en-GB" 
title                    : "David Cole"
title_separator          : "|"
subtitle                 : # site tagline that appears below site title in masthead
name                     : "David Cole"
description              : "Project portfolio and blog"
url                      : "https://DC293.github.io"
repository               : "DC293/DC293.github.io"
logo                     : "/assets/images/Headshot.png"
masthead_title           : # if you want to overwrite website title with a different title

# ============================= Author =============================
author:
  name     : "David Cole"
  avatar   : "/assets/images/Headshot_large.jpg"
  bio      : "Project portfolio and blog"
  location : "London, UK"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dc293"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/dcole123/"

# ============================= Comments =============================
# https://mmistakes.github.io/minimal-mistakes/docs/configuration/#comments
#comments:
 # provider               : "disqus" # false (default), "disqus", "discourse", "facebook", "staticman", "staticman_v2", "utterances", "custom"
  #disqus:
   # shortname            : "michaelcoleblog" # https://help.disqus.com/customer/portal/articles/466208-what-s-a-shortname-

# ============================= Footer =============================
footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dc293"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/dcole123/"

# ============================= Defaults =============================
words_per_minute         : 200
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout                    : single
      author_profile            : true
      read_time                 : true
      show_date                 : true
      comments                  : true
      share                     : true
      related                   : true
      enable_copy_code_button   : true
      show_excerpts             : true
      entries_layout            : grid


# ============================= Plugins =============================
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# mimic GitHub Pages with --safe
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# ============================= Reading Files =============================
include:
  - .htaccess
  - _pages   # Include _pages to allow processing of pages like home.md
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - vendor
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - assets/js/plugins
  - assets/js/_main.js
  - assets/js/vendor
  - Capfile
  - CHANGELOG
  - config
  - Gemfile
  - Gruntfile.js
  - gulpfile.js
  - LICENSE
  - log
  - node_modules
  - package.json
  - package-lock.json
  - Rakefile
  - README
  - tmp
  - /docs # ignore Minimal Mistakes /docs
  - /test # ignore Minimal Mistakes /test
keep_files:
  - .git
  - .svn
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Markdown Processing
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

# Sass/SCSS
sass:
  sass_dir: _sass
  style: compressed # https://sass-lang.com/documentation/file.SASS_REFERENCE.html#output_style

# Collections
collections:
  puzzles:
    output: true
    permalink: /:collection/:path/
  data_science:
    output: true
    permalink: /:collection/:path/
  machine_learning:
    output: true
    permalink: /:collection/:path/

# Outputting
permalink: /:categories/:title/
paginate: 5 # amount of posts to show
paginate_path: /page:num/
timezone: # https://en.wikipedia.org/wiki/List_of_tz_database_time_zones
